<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account Recovery | Justly Versed</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6C63FF;
      --secondary: #03DAC6;
      --bg: #101014;
      --surface: #1C1C22;
      --on-surface: #E1E1E6;
    }
    body {
      background-color: var(--bg);
      color: var(--on-surface);
      font-family: 'Outfit', sans-serif;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background-color: var(--surface);
      padding: 40px;
      border-radius: 32px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.05);
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .logo { width: 60px; height: 60px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(108, 99, 255, 0.3); }
    h1 { font-size: 24px; font-weight: 800; margin: 0 0 10px 0; }
    p { color: rgba(225,225,230,0.6); line-height: 1.6; margin-bottom: 30px; }
    input {
      width: 100%;
      padding: 16px;
      margin-bottom: 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      color: white;
      box-sizing: border-box;
      outline: none;
    }
    input:focus { border-color: var(--primary); }
    button {
      width: 100%;
      padding: 16px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 14px;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: transform 0.2s;
    }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { margin-top: 20px; font-size: 14px; }
    .success { color: var(--secondary); }
    .error { color: #FF4B4B; }
    #reset-interface { display: none; }
    #loading-interface { display: block; }
  </style>
</head>
<body>

  <div class="container">
    <img src="https://raw.githubusercontent.com/JV885/jv_assets/refs/heads/main/jvlogowhite.png" class="logo" alt="JV">
    <div id="loading-interface">
      <p>Processing request...</p>
    </div>

    <div id="reset-interface">
      <h1 id="action-title">Reset Password</h1>
      <p id="action-desc">Enter your new secure password below.</p>
      <input type="password" id="new-password" placeholder="New Password">
      <button id="submit-btn" onclick="handleReset()">Update Password</button>
    </div>

    <div id="message-interface" style="display:none;">
      <h1 id="msg-title"></h1>
      <p id="msg-body"></p>
    </div>
    
    <div class="status" id="status-text"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getAuth, verifyPasswordResetCode, confirmPasswordReset, applyActionCode } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

    // ✅ PASTE YOUR FIREBASE CONFIG FROM SETTINGS HERE
    const firebaseConfig = {
      apiKey: "AIzaSyAn_162P8comN_d1d-6vSIdxHNNmfXIk9Q",
      authDomain: "jv-app-565cf.firebaseapp.com",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Get parameters from URL
    const urlParams = new URLSearchParams(window.location.search);
    const mode = urlParams.get('mode');
    const actionCode = urlParams.get('oobCode');

    window.onload = () => {
      if (!mode || !actionCode) {
        showError("Invalid link", "Please request a new link from the app.");
        return;
      }

      switch (mode) {
        case 'resetPassword':
          document.getElementById('loading-interface').style.display = 'none';
          document.getElementById('reset-interface').style.display = 'block';
          break;
        case 'verifyEmail':
          handleVerifyEmail();
          break;
        default:
          showError("Not Supported", "This action is not currently supported.");
      }
    };

    async function handleVerifyEmail() {
      try {
        await applyActionCode(auth, actionCode);
        showSuccess("Verified!", "Your email is confirmed. You can now log back into Justly Versed.");
      } catch (err) {
        showError("Verification Failed", err.message);
      }
    }

    window.handleReset = async () => {
      const newPassword = document.getElementById('new-password').value;
      const btn = document.getElementById('submit-btn');
      if (newPassword.length < 6) {
        alert("Password must be at least 6 characters.");
        return;
      }

      btn.disabled = true;
      try {
        await confirmPasswordReset(auth, actionCode, newPassword);
        showSuccess("Updated!", "Your password has been changed. Log in with your new password in-app.");
      } catch (err) {
        showError("Reset Failed", err.message);
      } finally {
        btn.disabled = false;
      }
    };

    function showSuccess(title, body) {
      updateUI(title, body, 'success');
    }

    function showError(title, body) {
      updateUI(title, body, 'error');
    }

    function updateUI(title, body, type) {
      document.getElementById('loading-interface').style.display = 'none';
      document.getElementById('reset-interface').style.display = 'none';
      const msgInt = document.getElementById('message-interface');
      msgInt.style.display = 'block';
      document.getElementById('msg-title').innerText = title;
      document.getElementById('msg-title').className = type;
      document.getElementById('msg-body').innerText = body;
    }
  </script>
</body>
</html>
